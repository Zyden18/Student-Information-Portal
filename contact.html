<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #0f172a;
    }

    .info {
      margin: 25px 0;
      line-height: 1.8;
      font-size: 1.05rem;
    }

    .item {
      margin-bottom: 12px;
    }

    strong {
      color: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Contact Us</h1>
    <div class="info">
      <div class="item"><strong>Phone:</strong> +123 456 7890</div>
      <div class="item"><strong>Email:</strong> support@studentportal.edu</div>
      <div class="item"><strong>Address:</strong> 123 Student Avenue, Education City</div>
      <div class="item"><strong>Hours:</strong> Monday - Friday, 8:00 AM - 5:00 PM</div>
    </div>
  </div>
</body>
</html>
