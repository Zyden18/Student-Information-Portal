<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Information</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 5px 16px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #0f172a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 1rem;
    }

    th, td {
      border: 1px solid #dbe3f0;
      padding: 12px 14px;
      text-align: left;
    }

    th {
      background: #e0ebff;
      color: #1e3a8a;
    }

    tr:nth-child(even) {
      background: #f8fbff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Student Information</h1>
    <table>
      <tr>
        <th>Field</th>
        <th>Details</th>
      </tr>
      <tr>
        <td>Student Name</td>
        <td>Maria Santos</td>
      </tr>
      <tr>
        <td>Student ID</td>
        <td>2024-1187</td>
      </tr>
      <tr>
        <td>Course</td>
        <td>Bachelor of Science in Information Technology</td>
      </tr>
      <tr>
        <td>Year Level</td>
        <td>2nd Year</td>
      </tr>
      <tr>
        <td>Section</td>
        <td>BSIT-2A</td>
      </tr>
      <tr>
        <td>Email</td>
        <td>maria.santos@studentportal.edu</td>
      </tr>
      <tr>
        <td>Phone</td>
        <td>+63 912 345 6789</td>
      </tr>
      <tr>
        <td>Status</td>
        <td>Active</td>
      </tr>
    </table>
  </div>
</body>
</html>
